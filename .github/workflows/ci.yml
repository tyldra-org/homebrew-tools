# Answers: does every formula pass Homebrew's checks, and do the workflows?
# Three jobs:
#   formulas   brew style and audit on every formula; on a pull request,
#              also installs and tests each formula it changes
#   workflows  actionlint, when a pull request or push changes .github
#              (cask updates never do), and on manual runs
#   check      passes only when both did; the main ruleset requires it
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the older run. Pushes to main all
# run, so each one is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  # From the workflow `brew tap-new` writes, without bottles or setup: the formulas
  # install release binaries, so there is nothing to build. macOS on Apple
  # Silicon only, the one platform the formulas support.
  formulas:
    name: formulas
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          token: ${{ github.token }}

      # Without test-bot's cleanup and setup steps: on a fresh runner they only
      # tidy and run brew doctor and brew config, about 50 of the job's 100
      # seconds, and change nothing the checks below see.

      # brew style installs RuboCop and its gems on first use; it took 44 of
      # test-bot's 50 seconds. The gems come from the Actions cache, keyed on
      # Homebrew's Gemfile.lock, as Homebrew's own tap-syntax CI does. Only main
      # saves them; pull requests restore main's.
      - name: Restore Homebrew's gems
        id: gems
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      # brew style and brew audit on every formula in the tap.
      - run: brew test-bot --only-tap-syntax

      - name: Save Homebrew's gems
        if: github.ref == 'refs/heads/main' && steps.gems.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}

      # Installs, tests and audits each formula the pull request changes.
      - if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae --skip-dependents

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Dependabot cannot bump this; update it by hand.
      ACTIONLINT_VERSION: v1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit; its first parent is
          # main, so the diff is exactly what the pull request changes.
          fetch-depth: 2
          persist-credentials: false

      # Cask updates never touch the workflows, so they skip actionlint and
      # cannot fail on it. An unknown diff lints.
      - name: Did a workflow change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push) if git fetch --no-tags --depth=1 origin "$BEFORE"; then base=$BEFORE; fi ;;
          esac
          # Only a full commit ID counts; anything else lints.
          if [[ ! $base =~ ^[0-9a-f]{40}$ ]]; then base=""; fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- .github; then
            echo "No workflow changed, so actionlint is skipped."
            echo "lint=false" >> "$GITHUB_OUTPUT"
          else
            echo "lint=true" >> "$GITHUB_OUTPUT"
          fi

      # actionlint comes from the Actions cache, so most runs download
      # nothing. On a miss it is built from the Go module proxy, which
      # go install checks against the Go checksum database, with retries.
      # Only main saves it; pull requests restore it.
      # Downloading GitHub's release archive instead returned 504 to the
      # runners for half an hour on 2026-11-09 and failed this job three times.
      - name: Restore actionlint
        if: steps.changed.outputs.lint == 'true'
        id: actionlint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: ${{ runner.os }}-actionlint-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.changed.outputs.lint == 'true' && steps.actionlint.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 15))
          done

      - name: Save actionlint
        if: github.ref == 'refs/heads/main' && steps.changed.outputs.lint == 'true' && steps.actionlint.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: ${{ runner.os }}-actionlint-${{ env.ACTIONLINT_VERSION }}

      - name: Workflows
        if: steps.changed.outputs.lint == 'true'
        run: ~/go/bin/actionlint

  # A skipped job does not fail a required check, so this one looks at every
  # result.
  check:
    name: check
    if: always()
    needs: [formulas, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
