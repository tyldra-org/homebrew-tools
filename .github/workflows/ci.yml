# Answers: does every formula pass Homebrew's checks, and do the workflows?
# Three jobs:
#   formulas   brew style and audit on every formula; on a pull request,
#              also installs and tests each formula it changes
#   workflows  actionlint
#   check      passes only when both did; the main ruleset requires it
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the older run. Pushes to main all
# run, so each one is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  # From the workflow `brew tap-new` writes, without bottles: the formulas
  # install release binaries, so there is nothing to build. macOS on Apple
  # Silicon only, the one platform the formulas support.
  formulas:
    name: formulas
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ github.token }}

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # brew style and brew audit on every formula in the tap.
      - run: brew test-bot --only-tap-syntax

      # Installs, tests and audits each formula the pull request changes.
      - if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae --skip-dependents

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Dependabot cannot bump this; update it by hand.
      ACTIONLINT_VERSION: v1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint comes from the Actions cache, so most runs download
      # nothing. On a miss it is built from the Go module proxy, which
      # go install checks against the Go checksum database, with retries.
      # Downloading GitHub's release archive instead returned 504 to the
      # runners for half an hour on 2026-11-09 and failed this job three times.
      - name: Restore actionlint
        id: actionlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/actionlint
          key: ${{ runner.os }}-actionlint-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.actionlint.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 15))
          done

      - name: Workflows
        run: ~/go/bin/actionlint

  # A skipped job does not fail a required check, so this one looks at every
  # result.
  check:
    name: check
    if: always()
    needs: [formulas, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
